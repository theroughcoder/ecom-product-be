spring.application.name=ecom-product-be
server.port=8080
spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
jwt.key=${JWT_KEY:}
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Eureka Server URL
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Optional but recommended
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# AWS
aws.s3.bucketName=${aws_bucket_name}
aws.s3.accessKey=${aws_access_key}
aws.s3.secretKey=${aws_secret_key}